# Dependabot version updates. Vulnerability alerts and security-update PRs are a separate,
# repository-level setting (Settings > Code security > Dependabot) and are not controlled by this
# file — they already fire independently of the schedule below (see the moderate advisory GitHub
# reports on this repo's Dependabot alerts page).
#
# Both ecosystems are grouped into a single weekly PR each, rather than one PR per outdated
# dependency, so routine bumps do not create a flood of individual reviews.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    # Node.js 22 is the deliberate compatibility floor. Keep its ambient types pinned to that
    # runtime line instead of allowing a routine dependency group to raise the effective minimum.
    ignore:
      - dependency-name: '@types/node'
      # Vite+ owns the toolchain and its runtime support. Upgrade it deliberately together with the
      # Node matrix rather than allowing a routine group to raise the development runtime floor.
      - dependency-name: 'vite-plus'
      - dependency-name: 'vite'
    groups:
      npm-dependencies:
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - '*'
