name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint and format check
        run: npm run lint

      - name: Build from a clean state
        run: npm run clean && npm run build

      # The default suite must never need a model service. If this step starts requiring
      # network access, that is a regression in the deterministic-only guarantee.
      - name: Unit, integration, fixture and e2e tests
        run: npm test

      - name: Fixture provenance and corpus integrity
        run: node scripts/validate-fixtures.mjs

      - name: Deterministic-only run over the fixture corpus
        run: |
          node dist/cli/main.js lint fixtures/original/*.md --deterministic-only --json > /tmp/ste-ai.json
          node -e "
            const r = require('/tmp/ste-ai.json');
            if (r.conformance.claim !== 'none') {
              throw new Error('bundled pack must not claim conformance');
            }
            const total = r.results.reduce((n, x) => n + x.diagnostics.length, 0);
            if (total === 0) throw new Error('expected diagnostics on the original corpus');
            console.log('deterministic-only run produced ' + total + ' diagnostics across ' + r.results.length + ' files');
          "

      - name: Confirm the rule set reports itself as provisional
        run: |
          node dist/cli/main.js rules --json > /tmp/rules.json
          node -e "
            const rules = require('/tmp/rules.json');
            if (rules.length !== 14) throw new Error('expected 14 rules, got ' + rules.length);
            const nonProvisional = rules.filter((r) => r.status !== 'provisional');
            if (nonProvisional.length > 0) {
              throw new Error('rules claiming non-provisional status: ' + nonProvisional.map((r) => r.id).join(', '));
            }
            console.log('all 14 rules report provisional status');
          "
