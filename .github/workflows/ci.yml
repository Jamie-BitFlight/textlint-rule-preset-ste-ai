name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Every step invokes a script or an npm script. No logic is inlined in this file: inline YAML code
# is not linted, not type-checked, not syntax-highlighted and not runnable locally. Anything a step
# needs to do lives in scripts/ci/ where it can be reviewed and executed like any other code.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 24 is Node's current Active LTS and the floor advertised in package.json's
          # `engines.node`. Node 20 reached end-of-life on 2026-04-30; Node 22 is Maintenance LTS,
          # not Active — neither is a version this project should advertise support for.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint and format check
        run: npm run lint

      - name: Build from a clean state
        run: npm run build:clean

      # The default suite must never need a model service. If this step starts requiring network
      # access, that is a regression in the deterministic-only guarantee.
      #
      # Runs `test:coverage`, not plain `test`: vitest.config.ts's coverage `thresholds` are only
      # evaluated when coverage collection is enabled (`--coverage`), so this is the step that
      # actually enforces them — running the plain suite here would let a coverage regression pass
      # CI silently despite the thresholds existing in config.
      - name: Unit, integration, fixture and e2e tests (with coverage enforcement)
        run: npm run test:coverage

      - name: Fixture provenance and corpus integrity
        run: node scripts/validate-fixtures.mjs

      - name: CLI exit-code contract over the fixture corpus
        run: scripts/ci/check-exit-codes.sh

      - name: Confirm the rule set reports itself as provisional
        run: scripts/ci/check-rules-provisional.sh

      - name: Confirm every candidate passage still has reviewer ground truth
        run: scripts/ci/check-candidate-ground-truth.sh

      - name: Confirm the corpus provenance totals are unchanged
        run: scripts/ci/check-annotation-provenance.sh
