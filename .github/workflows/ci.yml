name: CI

on:
  push:
    # Feature branches are verified by the pull_request event below. Restricting push to main
    # prevents the same commit from running this matrix twice while its pull request is open.
    branches: [main]
  pull_request:
    branches: [main]

# Every step invokes a script or an npm script. No logic is inlined in this file: inline YAML code
# is not linted, not type-checked, not syntax-highlighted and not runnable locally. Anything a step
# needs to do lives in scripts/ci/ where it can be reviewed and executed like any other code.
jobs:
  verify:
    name: Verify on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Format, lint, and type check
        run: vp check

      - name: Build from a clean state
        run: vp pack

      # The default suite must never need a model service. If this step starts requiring network
      # access, that is a regression in the deterministic-only guarantee.
      #
      # Runs `vp test --coverage`, not plain `vp test`: vite.config.ts's coverage `thresholds` are
      # only evaluated when coverage collection is enabled, so this is the step that actually
      # enforces them. Running the plain suite here would let a coverage regression pass CI silently
      # despite the thresholds existing in config.
      - name: Unit, integration, fixture and e2e tests (with coverage enforcement)
        run: vp test --coverage

      - name: Fixture provenance and corpus integrity
        run: node scripts/validate-fixtures.mjs

      - name: CLI exit-code contract over the fixture corpus
        run: scripts/ci/check-exit-codes.sh

      - name: Confirm the rule set reports itself as provisional
        run: scripts/ci/check-rules-provisional.sh

      - name: Confirm every candidate passage still has reviewer ground truth
        run: scripts/ci/check-candidate-ground-truth.sh

      - name: Confirm the corpus provenance totals are unchanged
        run: scripts/ci/check-annotation-provenance.sh

      - name: Confirm shipped textlint configs actually resolve preset-ste-ai
        run: scripts/ci/check-textlint-configs-resolve.sh

      - name: Confirm the pre-commit hook manifest is shaped correctly and still works
        run: scripts/ci/check-pre-commit-hook-manifest.sh

      - name: Confirm the worked rule-pack example still prints what its README quotes
        run: scripts/ci/check-rule-pack-example.sh

  # Separate job, deliberately outside the `verify` matrix. This lints every markdown file the
  # repository authors with the preset the repository ships, which takes minutes; running it once
  # per Node version in that matrix would multiply that cost to prove the same thing repeatedly. It
  # does not depend on the Node version under test, only on the preset behaving as built.
  dogfood:
    name: Lint this repository's own prose with its own preset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: 24
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build from a clean state
        run: vp pack

      - name: Ratchet the dogfood lint baseline
        run: node scripts/ci/check-dogfood-lint.mjs
