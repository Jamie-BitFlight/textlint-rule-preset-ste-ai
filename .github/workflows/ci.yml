name: CI

# `push` is scoped to `main` (this repo's default branch) rather than every branch. Every other
# branch is already covered by the `pull_request` trigger below, and in this repo's actual workflow
# a branch is pushed and its PR opened together (see PRs #44, #45) — there is no pattern of work
# sitting on a branch, unopened as a PR, expecting CI. Without this scoping, a push to a branch with
# an open PR fires both `push` (branches: ['**'] matches everything) and `pull_request` synchronize
# for the same commit, producing two redundant `verify` runs — observed directly on this repo's own
# PRs #44 and #45, two check runs with different run IDs for one SHA. Scoping `push` to `main` still
# covers direct pushes/merges landing on the default branch, which `pull_request` alone would not.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref (branch or PR head) cancels a still-running older run for that ref,
# instead of letting both finish. Without this, two quick pushes to the same branch leave two
# `verify` runs racing to completion on stale and current code alike.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every step invokes a script or an npm script. No logic is inlined in this file: inline YAML code
# is not linted, not type-checked, not syntax-highlighted and not runnable locally. Anything a step
# needs to do lives in scripts/ci/ where it can be reviewed and executed like any other code.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24 is Node's current Active LTS and the floor advertised in package.json's
          # `engines.node`. Node 20 reached end-of-life on 2026-04-30; Node 22 is Maintenance LTS,
          # not Active — neither is a version this project should advertise support for.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint and format check
        run: npm run lint

      - name: Build from a clean state
        run: npm run build:clean

      # The default suite must never need a model service. If this step starts requiring network
      # access, that is a regression in the deterministic-only guarantee.
      - name: Unit, integration, fixture and e2e tests
        run: npm test

      - name: Fixture provenance and corpus integrity
        run: node scripts/validate-fixtures.mjs

      - name: CLI exit-code contract over the fixture corpus
        run: scripts/ci/check-exit-codes.sh

      - name: Confirm the rule set reports itself as provisional
        run: scripts/ci/check-rules-provisional.sh

      - name: Confirm every candidate passage still has reviewer ground truth
        run: scripts/ci/check-candidate-ground-truth.sh
